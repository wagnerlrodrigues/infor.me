<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Ajuda Técnica</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    .card {
      background: #1e2a33;
      padding: 24px;
      width: 100%;
      max-width: 420px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,.4);
    }
    h1 { margin: 0 0 10px; font-size: 22px; text-align: center; }
    label { display: block; margin-top: 14px; font-size: 14px; }
    select, textarea, button {
      width: 100%; margin-top: 6px; padding: 10px;
      border-radius: 6px; border: none; font-size: 14px;
    }
    select, textarea { background: #f5f5f5; color: #000; }
    textarea { resize: vertical; min-height: 80px; }
    button { margin-top: 18px; background: #25d366; color: #000; font-weight: bold; cursor: pointer; }
    button.secondary { background: #ccc; margin-top: 8px; }

    .modal {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.7);
      display: none; align-items: center; justify-content: center;
    }
    .modal-content {
      background: #fff; color: #000;
      width: 100%; max-width: 380px;
      border-radius: 12px; padding: 20px; text-align: center;
    }
    .modal-content img {
      width: 120px; height: 120px;
      object-fit: cover; border-radius: 50%; margin-bottom: 10px;
    }
    .tag { font-size: 12px; background: #eee; display: inline-block; padding: 4px 8px; border-radius: 12px; margin: 4px 2px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Ajuda Técnica</h1>

    <label>Escola</label>
    <select id="escola"></select>

    <label>Motivo do pedido</label>
    <textarea id="motivo" placeholder="Descreva o problema..."></textarea>

    <button onclick="previsualizar()">Continuar</button>
  </div>

  <div class="modal" id="modal">
    <div class="modal-content">
      <img id="foto">
      <h2 id="nome"></h2>
      <div id="horarios"></div>
      <p id="escolaModal"></p>
      <button onclick="abrirWhatsApp()">Falar no WhatsApp</button>
      <button class="secondary" onclick="fechar()">Cancelar</button>
    </div>
  </div>

<script>
// tecnico_escola.csv -> nome_tecnico,gre,escola
// tecnicos.csv -> nome,telefone,LINK,horario1,horario2,dias,foto

let tecnicos = {};
let vinculos = [];
let selecionado = null;

function parseCSV(texto) {
  const linhas = texto.replace(/\r/g, '').trim().split('\n');
  const sep = linhas[0].includes(';') ? ';' : ',';
  const cab = linhas.shift().split(sep).map(h => h.trim());
  return linhas.map(l => {
    const v = l.split(sep).map(x => x.trim());
    return cab.reduce((o, c, i) => (o[c] = v[i] || '', o), {});
  });
}

async function iniciar() {
  // técnicos
  const t = await fetch('tecnicos.csv');
  parseCSV(await t.text()).forEach(x => tecnicos[x.nome] = x);

  // vínculos
  const e = await fetch('tecnico_escola.csv');
  vinculos = parseCSV(await e.text());

  const select = document.getElementById('escola');
  select.innerHTML = '<option value="">Selecione a escola</option>';

  vinculos.forEach((v, i) => {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = `${v.escola} (${v.gre})`;
    select.appendChild(opt);
  });
}

function previsualizar() {
  const select = document.getElementById('escola');
  const idx = select.value;
  const motivo = document.getElementById('motivo').value.trim();

  if (idx === '' || !motivo) {
    alert('Selecione a escola e informe o motivo.');
    return;
  }

  const vinc = vinculos[idx];
  const tec = tecnicos[vinc.nome_tecnico];

  if (!tec) {
    alert('Técnico não encontrado para essa escola.');
    return;
  }

  selecionado = { vinc, tec, motivo };

  document.getElementById('foto').src = tec.foto || 'https://via.placeholder.com/120';
  document.getElementById('nome').textContent = tec.nome;
  document.getElementById('escolaModal').textContent = `Escola: ${vinc.escola}`;

  const h = document.getElementById('horarios');
  h.innerHTML = '';
  if (tec.horario1) h.innerHTML += `<span class="tag">${tec.horario1}</span>`;
  if (tec.horario2) h.innerHTML += `<span class="tag">${tec.horario2}</span>`;

  document.getElementById('modal').style.display = 'flex';
}

function fechar() {
  document.getElementById('modal').style.display = 'none';
}

function abrirWhatsApp() {
  const { tec, vinc, motivo } = selecionado;
  const msg = encodeURIComponent(
    `Olá ${tec.nome}, preciso de ajuda técnica.\nGRE: ${vinc.gre}\nEscola: ${vinc.escola}\nMotivo: ${motivo}`
  );

  const link = tec.LINK
    ? `${tec.LINK}&text=${msg}`
    : `https://wa.me/55${tec.telefone}?text=${msg}`;

  window.open(link, '_blank');
}

iniciar();
</script>
</body>
</html>
